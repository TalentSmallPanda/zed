name: release
on:
  push:
    tags:
      - v*
permissions:
  contents: write
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  check_version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/zed/Cargo.toml | head -1)
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match crates/zed/Cargo.toml version ${version}"
            exit 1
          fi

  bundle_mac:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, x86_64]
    # Intel builds are cross-compiled on the Apple Silicon runner.
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Install lld
        run: brew install lld
      - name: Use the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      # With MACOS_CERTIFICATE alone the bundle is signed but not notarized.
      # Without it the bundle is ad-hoc signed.
      - name: Prepare provisioning profile
        env:
          MACOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          if [ -n "$MACOS_PROVISIONING_PROFILE_BASE64" ]; then
            profile_path="$RUNNER_TEMP/embedded.provisionprofile"
            echo "$MACOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
            echo "MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
          fi
      - name: Bundle
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_NOTARIZATION_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_NOTARIZATION_TEAM: ${{ secrets.APPLE_NOTARIZATION_TEAM }}
        run: script/bundle-mac ${{ matrix.arch }}-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            target/${{ matrix.arch }}-apple-darwin/release/Zed-${{ matrix.arch }}.dmg
            target/zed-remote-server-macos-${{ matrix.arch }}.gz
          if-no-files-found: error

  bundle_linux:
    needs: check_version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: ./script/linux
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: echo stable > crates/zed/RELEASE_CHANNEL
      - name: Bundle
        run: ./script/bundle-linux --skip-sentry
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/release/zed-linux-${{ matrix.arch }}.tar.gz
            target/zed-remote-server-linux-${{ matrix.arch }}.gz
          if-no-files-found: error

  bundle_windows:
    needs: check_version
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: rustup show
      - name: Use the stable release channel
        run: Set-Content -Path crates/zed/RELEASE_CHANNEL -Value stable -NoNewline
        shell: pwsh
      - name: Bundle
        run: script/bundle-windows.ps1 -Architecture x86_64
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            target/Zed-x86_64.exe
            target/zed-remote-server-windows-x86_64.zip
          if-no-files-found: error

  release:
    needs: [bundle_mac, bundle_linux, bundle_windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
